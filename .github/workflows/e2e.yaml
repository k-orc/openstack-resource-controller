name: e2e

on:
  merge_group:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Run acceptance tests against OpenStack ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "hibiscus"
            openstack_version: "stable/2026.2"
            ubuntu_version: "24.04"
          - name: "gazpacho"
            openstack_version: "stable/2026.1"
            ubuntu_version: "24.04"
          - name: "flamingo"
            openstack_version: "stable/2025.2"
            ubuntu_version: "24.04"
    env:
      image_tag: virtual-registry.k-orc.cloud/ci:commit-${GITHUB_SHA::7}

    runs-on: ubuntu-${{ matrix.ubuntu_version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      with:
        persist-credentials: false

    - name: Download pre-built amphora image
      run: |
        wget -q "https://tarballs.opendev.org/openstack/octavia/test-images/test-only-amphora-x64-haproxy-ubuntu-noble.qcow2" -O /tmp/amphora-x64-haproxy.qcow2

    - name: Deploy devstack
      uses: gophercloud/devstack-action@60ca1042045c0c9e3e001c64575d381654ffcba1 # tag=v0.19
      with:
        enable_workaround_docker_io: 'false'
        branch: ${{ matrix.openstack_version }}
        enabled_services: "openstack-cli-server,neutron-trunk,neutron-port-trusted-vif,neutron-uplink-status-propagation,octavia,o-api,o-cw,o-hm,o-hk,o-da"
        conf_overrides: |
          enable_plugin neutron https://github.com/openstack/neutron ${{ matrix.openstack_version }}
          enable_plugin manila https://github.com/openstack/manila ${{ matrix.openstack_version }}
          enable_plugin designate https://github.com/openstack/designate ${{ matrix.openstack_version }}
          DESIGNATE_BACKEND_DRIVER=bind9
          enable_plugin octavia https://github.com/openstack/octavia ${{ matrix.openstack_version }}
          OCTAVIA_AMP_IMAGE_FILE=/tmp/amphora-x64-haproxy.qcow2
          LIBVIRT_CPU_MODE=host-passthrough

          [[post-config|/etc/nova/nova.conf]]
          [quota]
          instances = 50

          [filter_scheduler]
          enabled_filters = ComputeFilter,ComputeCapabilitiesFilter,ImagePropertiesFilter,ServerGroupAntiAffinityFilter,ServerGroupAffinityFilter,SameHostFilter,DifferentHostFilter,SimpleCIDRAffinityFilter,JsonFilter

    - name: Deploy a Kind Cluster
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # tag=v1.15.1
      with:
        cluster_name: orc

    - name: Build and push a container image to Kind
      run: |
        make docker-build IMG=${{ env.image_tag }}
        kind load docker-image ${{ env.image_tag }} ${{ env.image_tag }} --name orc

    - name: Deploy orc
      run: |
        kubectl config use-context kind-orc
        make deploy IMG=${{ env.image_tag }} LOGLEVEL=5

    - name: Run e2e tests
      run: |
        if [[ "${{ matrix.name }}" != "gazpacho" ]]; then
            echo "Skip limit import tests due to Keystone API issue(list limit) in older versions"
            rm -rf internal/controllers/limit/tests/limit-import*
        fi

        make test-e2e
        make test-examples

    - name: Generate logs on failure
      run: ./hack/collectlogs
      if: failure()
      env:
        OS_CLOUD: devstack

    - name: Upload logs artifacts on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
      with:
        name: e2e-${{ matrix.name }}-${{ github.run_id }}
        path: /tmp/artifacts/*
