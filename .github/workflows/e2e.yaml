name: e2e

on:
  merge_group:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Run acceptance tests against OpenStack ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "gazpacho"
            openstack_version: "stable/2026.1"
            ubuntu_version: "24.04"
            # Pin glance before LP#2166488 breakage. Remove once the fix is backported.
            glance_pin: "24eab18960afaaf246e38efcb9eded21c7e5da9b"
          - name: "flamingo"
            openstack_version: "stable/2025.2"
            ubuntu_version: "24.04"
            # Pin glance before LP#2166488 breakage. Remove once the fix is backported.
            glance_pin: "577b1a16bd8c2fd4df4ad66c902f4e6b44d71618"
          - name: "epoxy"
            openstack_version: "stable/2025.1"
            ubuntu_version: "24.04"
            # Pin glance before LP#2166488 breakage. Remove once the fix is backported.
            glance_pin: "0b97347daaf0055cb18d94d32361265d81d15803"
    env:
      image_tag: virtual-registry.k-orc.cloud/ci:commit-${GITHUB_SHA::7}

    runs-on: ubuntu-${{ matrix.ubuntu_version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      with:
        persist-credentials: false

    - name: Deploy devstack
      uses: gophercloud/devstack-action@60ca1042045c0c9e3e001c64575d381654ffcba1 # tag=v0.19
      with:
        enable_workaround_docker_io: 'false'
        branch: ${{ matrix.openstack_version }}
        enabled_services: "openstack-cli-server,neutron-trunk"
        conf_overrides: |
          ${{ matrix.glance_pin && format('GLANCE_BRANCH={0}', matrix.glance_pin) || '' }}

    - name: Deploy a Kind Cluster
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # tag=v1.14.0
      with:
        cluster_name: orc

    - name: Build and push a container image to Kind
      run: |
        make docker-build IMG=${{ env.image_tag }}
        kind load docker-image ${{ env.image_tag }} ${{ env.image_tag }} --name orc

    - name: Deploy orc
      run: |
        kubectl config use-context kind-orc
        make deploy IMG=${{ env.image_tag }} LOGLEVEL=5

    - name: Run e2e tests
      run: |
        make test-e2e
        make test-examples

    - name: Generate logs on failure
      run: ./hack/collectlogs
      if: failure()
      env:
        OS_CLOUD: devstack

    - name: Upload logs artifacts on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
      with:
        name: e2e-${{ matrix.name }}-${{ github.run_id }}
        path: /tmp/artifacts/*
