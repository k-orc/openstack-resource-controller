name: release

on:
  push:
    tags:
      - v**

permissions:
  contents: read

env:
  image_tag: quay.io/orc/openstack-resource-controller:${GITHUB_REF_NAME}
  bundle_image_tag: quay.io/orc/openstack-resource-controller-bundle:${GITHUB_REF_NAME}

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      with:
        # Required for git describe to generate correct output for populating
        # build variables
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # tag=v4.4.0
    - name: Install build dependencies
      run: sudo apt-get install -y libgpgme-dev

    - run: |
        docker login -u="${{ secrets.QUAY_USERNAME }}" -p="${{ secrets.QUAY_TOKEN }}" quay.io # zizmor: ignore[secrets-outside-env]
        make docker-buildx IMG=${{ env.image_tag }}
        make build-bundle-image BUNDLE_IMG=${{ env.bundle_image_tag }}
        make docker-push IMG=${{ env.bundle_image_tag }}

  helm:
    needs: push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for cosign keyless signing

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      with:
        persist-credentials: false

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # tag=v5.0.1

    - name: Derive chart version from git tag
      id: version
      run: |
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#v}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "appVersion=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Stamp Chart.yaml versions
      env:
        CHART_VERSION: ${{ steps.version.outputs.version }}
        APP_VERSION: ${{ steps.version.outputs.appVersion }}
      run: |
        for chart in charts/orc-crds charts/orc; do
          sed -i "s/^version: .*/version: ${CHART_VERSION}/" "${chart}/Chart.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" "${chart}/Chart.yaml"
        done

    - name: Install cosign
      uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # tag=v3.8.2

    - name: Package and push charts
      id: push
      env:
        CHART_VERSION: ${{ steps.version.outputs.version }}
      run: |
        helm registry login quay.io -u "${{ secrets.QUAY_USERNAME }}" -p "${{ secrets.QUAY_TOKEN }}" # zizmor: ignore[secrets-outside-env]
        helm package charts/orc-crds
        helm package charts/orc

        ORC_CRDS_OUTPUT=$(helm push "orc-crds-${CHART_VERSION}.tgz" oci://quay.io/orc/helm 2>&1)
        ORC_OUTPUT=$(helm push "orc-${CHART_VERSION}.tgz" oci://quay.io/orc/helm 2>&1)

        echo "${ORC_CRDS_OUTPUT}"
        echo "${ORC_OUTPUT}"

        echo "orc_crds_digest=$(echo "${ORC_CRDS_OUTPUT}" | awk '/Digest:/{print $2}')" >> "$GITHUB_OUTPUT"
        echo "orc_digest=$(echo "${ORC_OUTPUT}" | awk '/Digest:/{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Sign charts with cosign
      env:
        ORC_CRDS_DIGEST: ${{ steps.push.outputs.orc_crds_digest }}
        ORC_DIGEST: ${{ steps.push.outputs.orc_digest }}
      run: |
        cosign sign --yes "quay.io/orc/helm/orc-crds@${ORC_CRDS_DIGEST}"
        cosign sign --yes "quay.io/orc/helm/orc@${ORC_DIGEST}"
