on:
  push:
    branches:
    - main
    paths:
    - 'website/**'
    - 'api/v1alpha1/**'
    - '.github/workflows/website.yaml'
name: website

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      with:
        persist-credentials: false

    - name: Pip install
      run: pip install -Ur website/requirements.txt

    - name: Build the site
      run: zensical build --strict --config-file website/mkdocs.yml

    - name: Post-build (analytics)
      run: bash website/post-build.sh website/rendered

    - name: Publish to Cloudflare Pages
      uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # tag=v4.0.0
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }} # zizmor: ignore[secrets-outside-env]
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} # zizmor: ignore[secrets-outside-env]
        command: pages deploy website/rendered --project-name=k-orc
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
