---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: ImageMember
      name: imagemember-create-full
      ref: member
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Image
      name: imagemember-create-full
      ref: image
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Project
      name: imagemember-create-full
      ref: project
assertAll:
    - celExpr: "member.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
    - celExpr: "member.status.id == project.status.id"
    - celExpr: "member.status.resource.memberID == project.status.id"
    - celExpr: "member.status.resource.imageID == image.status.id"
    - celExpr: "member.status.resource.status == 'rejected'"
    - celExpr: "image.status.resource.members.exists(m, m.memberID == project.status.id && m.status == 'rejected')"
