---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: ImageMember
      name: imagemember-import-external
      ref: imagemember1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: ImageMember
      name: imagemember-import-external-not-this-one
      ref: imagemember2
assertAll:
    - celExpr: "imagemember1.status.id != imagemember2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: ImageMember
metadata:
  name: imagemember-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  resource:
    name: imagemember-import-external
    description: ImageMember imagemember-import-external from "imagemember-import" test
    # TODO(scaffolding): Add all fields the resource supports
