---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: ImageMember
      name: imagemember-update
      ref: imagemember
assertAll:
    - celExpr: "!has(imagemember.status.resource.description)"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: ImageMember
metadata:
  name: imagemember-update
status:
  resource:
    name: imagemember-update
    # TODO(scaffolding): validate that updated fields were all reverted to their original value
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
