---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Image
      name: imagemember-dependency
      ref: image
    - apiVersion: v1
      kind: Secret
      name: imagemember-dependency
      ref: secret
assertAll:
    - celExpr: "image.metadata.deletionTimestamp != 0"
    - celExpr: "'openstack.k-orc.cloud/imagemember' in image.metadata.finalizers"
    - celExpr: "secret.metadata.deletionTimestamp != 0"
    - celExpr: "'openstack.k-orc.cloud/imagemember' in secret.metadata.finalizers"
