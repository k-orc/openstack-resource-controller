---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: kubectl create secret generic openstack-clouds --from-file=clouds.yaml=${E2E_KUTTL_OSCLOUDS} ${E2E_KUTTL_CACERT_OPT}
    namespaced: true
  - script: |
      export E2E_KUTTL_CURRENT_TEST=imagemember-dependency
      cat ../templates/create-consumer.tmpl | envsubst | kubectl -n ${NAMESPACE} apply -f -
      ../templates/create-consumer-clouds.sh

---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: ImageMember
metadata:
  name: imagemember-dependency
spec:
  cloudCredentialsRef:
    cloudName: consumer
    secretName: consumer-clouds
  managementPolicy: managed
  resource:
    imageRef: imagemember-dependency
