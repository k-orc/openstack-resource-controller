---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # We expect the deletion to hang due to the finalizer, so use --wait=false
  - command: kubectl delete image.openstack.k-orc.cloud imagemember-dependency --wait=false
    namespaced: true
  - command: kubectl delete secret imagemember-dependency --wait=false
    namespaced: true
