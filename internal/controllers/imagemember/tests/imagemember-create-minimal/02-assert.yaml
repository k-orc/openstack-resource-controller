---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Image
      name: imagemember-create-minimal
      ref: image
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Project
      name: imagemember-create-minimal
      ref: project
assertAll:
    - celExpr: "image.status.resource.members.exists(m, m.memberID == project.status.id && m.status == 'pending')"
