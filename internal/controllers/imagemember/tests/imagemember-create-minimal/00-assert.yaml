---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: ImageMember
metadata:
  name: imagemember-create-minimal
status:
  resource:
    name: imagemember-create-minimal
    # TODO(scaffolding): Add all fields the resource supports
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: ImageMember
      name: imagemember-create-minimal
      ref: imagemember
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Image
      name: imagemember-create-minimal
      ref: image
assertAll:
    - celExpr: "imagemember.status.id != ''"
    - celExpr: "imagemember.status.resource.imageID == image.status.id"
    # TODO(scaffolding): Add more checks
