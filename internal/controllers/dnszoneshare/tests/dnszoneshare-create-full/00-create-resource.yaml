---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZone
metadata:
  name: dnszoneshare-create-full
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: dnszoneshare-create-full.example.com.
    email: admin@example.com
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZoneShare
metadata:
  name: dnszoneshare-create-full
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    zoneRef: dnszoneshare-create-full
    targetProjectID: "3fac9d0b0e0e4b0e9b0e000000000022"
