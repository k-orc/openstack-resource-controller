---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZoneShare
metadata:
  name: dnszoneshare-create-minimal
status:
  resource:
    name: dnszoneshare-create-minimal
    # TODO(scaffolding): Add all fields the resource supports
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSZoneShare
      name: dnszoneshare-create-minimal
      ref: dnszoneshare
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSZone
      name: dnszoneshare-create-minimal
      ref: dNSZone
assertAll:
    - celExpr: "dnszoneshare.status.id != ''"
    - celExpr: "dnszoneshare.status.resource.dNSZoneID == dNSZone.status.id"
    # TODO(scaffolding): Add more checks
