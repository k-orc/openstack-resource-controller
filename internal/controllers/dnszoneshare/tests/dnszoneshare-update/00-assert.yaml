kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSZoneShare
      name: dnszoneshare-update
      ref: dnszoneshare
assertAll:
    - celExpr: "!has(dnszoneshare.status.resource.description)"
