apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZoneShare
metadata:
  name: dnszoneshare-update
status:
  resource:
    name: dnszoneshare-update
    # TODO(scaffolding): Add matches for more fields
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
