---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZone
metadata:
  name: dnszoneshare-dependency
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: dnszoneshare-dependency.example.com.
    email: admin@example.com
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZoneShare
metadata:
  name: dnszoneshare-dependency-no-dnszone
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    zoneRef: dnszoneshare-dependency-pending
    targetProjectID: "3fac9d0b0e0e4b0e9b0e000000000023"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZoneShare
metadata:
  name: dnszoneshare-dependency-no-secret
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: dnszoneshare-dependency
  managementPolicy: managed
  resource:
    zoneRef: dnszoneshare-dependency
    targetProjectID: "3fac9d0b0e0e4b0e9b0e000000000024"
