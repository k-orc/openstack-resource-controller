---
# One zone, two shares to different target projects: the import filter below matches on zoneRef
# alone (no targetProjectID), which is ambiguous whenever a zone has more than one share - both
# are valid OpenStack resources and both match the filter.
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZone
metadata:
  name: dnszoneshare-import-error
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: dnszoneshare-import-error.example.com.
    email: admin@example.com
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZoneShare
metadata:
  name: dnszoneshare-import-error-external-1
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    zoneRef: dnszoneshare-import-error
    targetProjectID: "3fac9d0b0e0e4b0e9b0e000000000025"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZoneShare
metadata:
  name: dnszoneshare-import-error-external-2
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    zoneRef: dnszoneshare-import-error
    targetProjectID: "3fac9d0b0e0e4b0e9b0e000000000026"
