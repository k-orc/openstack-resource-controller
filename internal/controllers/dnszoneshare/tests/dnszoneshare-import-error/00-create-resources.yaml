---
# Two distinct zones: the import filter only matches on targetProjectID (see
# DNSZoneShareFilter in dnszoneshare_types.go), not the zone - two shares on different zones
# sharing the same targetProjectID are both valid OpenStack resources and both match the filter.
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZone
metadata:
  name: dnszoneshare-import-error-1
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: dnszoneshare-import-error-1.example.com.
    email: admin@example.com
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZone
metadata:
  name: dnszoneshare-import-error-2
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: dnszoneshare-import-error-2.example.com.
    email: admin@example.com
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZoneShare
metadata:
  name: dnszoneshare-import-error-external-1
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    zoneRef: dnszoneshare-import-error-1
    targetProjectID: "3fac9d0b0e0e4b0e9b0e000000000025"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZoneShare
metadata:
  name: dnszoneshare-import-error-external-2
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    zoneRef: dnszoneshare-import-error-2
    targetProjectID: "3fac9d0b0e0e4b0e9b0e000000000025"
