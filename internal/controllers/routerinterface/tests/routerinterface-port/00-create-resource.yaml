---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Network
metadata:
  name: routerinterface-port
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource: {}
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Subnet
metadata:
  name: routerinterface-port
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    networkRef: routerinterface-port
    ipVersion: 4
    cidr: 192.0.2.0/24
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Router
metadata:
  name: routerinterface-port-a
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource: {}
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RouterInterface
metadata:
  name: routerinterface-port-a
spec:
  type: Subnet
  routerRef: routerinterface-port-a
  subnetRef: routerinterface-port
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Port
metadata:
  name: routerinterface-port
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    networkRef: routerinterface-port
    addresses:
    - subnetRef: routerinterface-port
      ip: 192.0.2.10
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Router
metadata:
  name: routerinterface-port-b
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource: {}
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RouterInterface
metadata:
  name: routerinterface-port-b
spec:
  type: Port
  routerRef: routerinterface-port-b
  portRef: routerinterface-port
