---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Network
metadata:
  name: routerinterface-router-not-ready
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource: {}
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Subnet
metadata:
  name: routerinterface-router-not-ready
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    networkRef: routerinterface-router-not-ready
    ipVersion: 4
    cidr: 192.168.156.0/24
---
# Router exists but stays not Available while waiting on a missing network.
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Router
metadata:
  name: routerinterface-router-not-ready
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    externalGateways:
    - networkRef: routerinterface-router-not-ready-pending
