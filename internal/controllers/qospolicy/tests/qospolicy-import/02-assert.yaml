---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: QosPolicy
      name: qospolicy-import-external
      ref: qospolicy1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: QosPolicy
      name: qospolicy-import-external-not-this-one
      ref: qospolicy2
assertAll:
    - celExpr: "qospolicy1.status.id != qospolicy2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: QosPolicy
metadata:
  name: qospolicy-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  resource:
    name: qospolicy-import-external
    description: QosPolicy qospolicy-import-external from "qospolicy-import" test
