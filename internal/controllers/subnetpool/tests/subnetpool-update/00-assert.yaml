---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: SubnetPool
      name: subnetpool-update
      ref: subnetpool
assertAll:
    - celExpr: "subnetpool.status.id != ''"
    - celExpr: "!has(subnetpool.status.resource.description)"
    - celExpr: "!has(subnetpool.status.resource.tags)"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: SubnetPool
metadata:
  name: subnetpool-update
status:
  resource:
    name: subnetpool-update
    prefixes:
      - 192.168.30.0/24
    minPrefixLength: 16
    maxPrefixLength: 28
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
