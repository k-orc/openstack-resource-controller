---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Group
      name: group-dependency-no-domain
      ref: group
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Domain
      name: group-dependency
      ref: domain
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Group
      name: group-dependency-no-user
      ref: group1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: User
      name: group-dependency
      ref: user
assertAll:
    - celExpr: "group.status.resource.domainID == domain.status.id"
    - celExpr: "user.status.id in group1.status.resource.userIDs"
