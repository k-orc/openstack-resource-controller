---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Group
metadata:
  name: group-update-user
status:
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Group
    name: group-update-user
    ref: group
assertAll:
    - celExpr: "!has(group.status.resource.userIDs)"
