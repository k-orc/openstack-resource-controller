---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Group
metadata:
  name: group-import-with-user
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Group
    name: group-import-with-user
    ref: group
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: User
    name: group-import-with-user-external
    ref: user
assertAll:
  - celExpr: "group.status.id != ''"
  - celExpr: "user.status.id in group.status.resource.userIDs"
