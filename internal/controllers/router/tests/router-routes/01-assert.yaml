apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Router
metadata:
  name: router-routes
status:
  resource:
    name: router-routes
    description: Router from "routes" test
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Router
      name: router-routes
      ref: router
assertAll:
    - celExpr: "!has(router.status.resource.routes)"
