---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: LoadBalancer
metadata:
  name: loadbalancer-create-minimal
status:
  resource:
    name: loadbalancer-create-minimal
    provisioningStatus: ACTIVE
    operatingStatus: ONLINE
    adminStateUp: true
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: LoadBalancer
      name: loadbalancer-create-minimal
      ref: loadbalancer
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Subnet
      name: loadbalancer-create-minimal
      ref: subnet
assertAll:
    # Dynamic checks that require CEL - cross-resource comparisons and non-empty checks
    - celExpr: "loadbalancer.status.id != ''"
    - celExpr: "loadbalancer.status.resource.vipSubnetID == subnet.status.id"
    - celExpr: "loadbalancer.status.resource.vipAddress != ''"
    - celExpr: "loadbalancer.status.resource.vipNetworkID == subnet.status.resource.networkID"
    - celExpr: "loadbalancer.status.resource.vipPortID != ''"
    - celExpr: "loadbalancer.status.resource.projectID != ''"
    # The default provider depends on the cloud (amphora on devstack)
    - celExpr: "loadbalancer.status.resource.provider != ''"
    - celExpr: "!has(loadbalancer.status.resource.description)"
    - celExpr: "!has(loadbalancer.status.resource.flavorID)"
    - celExpr: "!has(loadbalancer.status.resource.tags)"
