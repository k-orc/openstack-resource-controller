---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: LoadBalancer
      name: loadbalancer-adopt
      ref: loadBalancer
    - apiVersion: v1
      kind: ConfigMap
      name: loadbalancer-adopt
      ref: saved
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Subnet
      name: loadbalancer-adopt
      ref: subnet
assertAll:
    - celExpr: "loadBalancer.status.id == saved.data.id"
    - celExpr: "'openstack.k-orc.cloud/loadbalancer' in subnet.metadata.finalizers"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: LoadBalancer
metadata:
  name: loadbalancer-adopt
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
