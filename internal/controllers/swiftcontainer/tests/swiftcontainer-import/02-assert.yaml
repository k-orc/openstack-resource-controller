---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: SwiftContainer
      name: swiftcontainer-import
      ref: imported
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: SwiftContainer
      name: swiftcontainer-import-external-not-this-one
      ref: trap
assertAll:
    - celExpr: "imported.status.id != trap.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: SwiftContainer
metadata:
  name: swiftcontainer-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  id: swiftcontainer-import-external
  resource:
    name: swiftcontainer-import-external
    metadata:
      - name: Owner
        value: orc-e2e
    bytesUsed: 0
    objectCount: 0
