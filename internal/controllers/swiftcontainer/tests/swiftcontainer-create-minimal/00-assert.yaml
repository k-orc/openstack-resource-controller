---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: SwiftContainer
metadata:
  name: swiftcontainer-create-minimal
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
      message: OpenStack resource is available
    - type: Progressing
      status: "False"
      reason: Success
      message: OpenStack resource is up to date
  id: swiftcontainer-create-minimal
  resource:
    name: swiftcontainer-create-minimal
    bytesUsed: 0
    objectCount: 0
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: SwiftContainer
      name: swiftcontainer-create-minimal
      ref: container
assertAll:
    - celExpr: "!has(container.status.resource.readACL)"
    - celExpr: "!has(container.status.resource.writeACL)"
    - celExpr: "!has(container.status.resource.metadata)"
