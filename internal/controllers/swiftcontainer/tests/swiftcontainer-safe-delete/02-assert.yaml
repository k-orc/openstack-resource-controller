---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: SwiftContainer
metadata:
  name: swiftcontainer-safe-delete-nonempty
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
      message: OpenStack resource is available
    - type: Progressing
      status: "True"
      reason: Progressing
      message: Waiting for the Swift container to be emptied before deletion
  resource:
    objectCount: 1
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: SwiftContainer
      name: swiftcontainer-safe-delete-nonempty
      ref: container
assertAll:
    - celExpr: "has(container.metadata.deletionTimestamp)"
    - celExpr: "'openstack.k-orc.cloud/swiftcontainer' in container.metadata.finalizers"
