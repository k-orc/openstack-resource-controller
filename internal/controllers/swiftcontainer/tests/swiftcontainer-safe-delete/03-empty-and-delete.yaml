apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      OS_CLIENT_CONFIG_FILE="$E2E_KUTTL_OSCLOUDS" openstack --os-cloud openstack object delete swiftcontainer-safe-delete-nonempty test_file.txt
  - command: kubectl wait --for=delete swiftcontainer/swiftcontainer-safe-delete-nonempty --timeout=90s
    namespaced: true
