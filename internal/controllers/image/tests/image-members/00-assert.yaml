---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Image
      name: image-members
      ref: image
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Project
      name: image-members-1
      ref: project1
assertAll:
    - celExpr: "image.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
    - celExpr: "image.status.conditions.exists(c, c.type == 'Progressing' && c.status == 'False')"
    - celExpr: "size(image.status.resource.members) == 1"
    - celExpr: "image.status.resource.members[0].memberID == project1.status.id"
    - celExpr: "image.status.resource.members[0].status == 'pending'"
    - celExpr: "'openstack.k-orc.cloud/image' in project1.metadata.finalizers"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Image
metadata:
  name: image-members
status:
  resource:
    status: active
    visibility: shared
