---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Image
      name: image-members
      ref: image
assertAll:
    - celExpr: "image.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
    - celExpr: "image.status.conditions.exists(c, c.type == 'Progressing' && c.status == 'False')"
    - celExpr: "!has(image.status.resource.members)"
