---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Image
metadata:
  name: image-adoption-2
status:
  resource:
    status: active
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Image
      name: image-adoption-1
      ref: image1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Image
      name: image-adoption-2
      ref: image2
assertAll:
    - celExpr: "image1.status.id != image2.status.id"
