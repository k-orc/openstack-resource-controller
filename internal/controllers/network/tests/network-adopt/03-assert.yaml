---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Project
      name: network-adopt
      ref: project
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Network
      name: network-adopt
      ref: network
assertAll:
    - celExpr: "'openstack.k-orc.cloud/network' in project.metadata.finalizers"
    - celExpr: "network.status.resource.projectID == project.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Network
metadata:
  name: network-adopt
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
