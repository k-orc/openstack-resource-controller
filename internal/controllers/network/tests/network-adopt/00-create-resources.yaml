---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Project
metadata:
  name: network-adopt
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource: {}
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Network
metadata:
  name: network-adopt-detached
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  managedOptions:
    onDelete: detach
  resource:
    name: network-adopt
    projectRef: network-adopt
