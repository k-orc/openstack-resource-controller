---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: RBACPolicy
      name: rbacpolicy-import-external
      ref: rbacpolicy1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: RBACPolicy
      name: rbacpolicy-import-not-this-one
      ref: rbacpolicy2
assertAll:
    - celExpr: "rbacpolicy1.status.id != rbacpolicy2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RBACPolicy
metadata:
  name: rbacpolicy-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  resource:
    action: access_as_shared
    targetProjectID: "3fac9d0b0e0e4b0e9b0e000000000016"
