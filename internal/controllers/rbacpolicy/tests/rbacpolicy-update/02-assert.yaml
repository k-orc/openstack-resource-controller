apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RBACPolicy
metadata:
  name: rbacpolicy-update
status:
  resource:
    action: access_as_shared
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
