---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: RBACPolicy
      name: rbacpolicy-import-dependency
      ref: rbacpolicy1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: RBACPolicy
      name: rbacpolicy-import-dependency-not-this-one
      ref: rbacpolicy2
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Project
      name: rbacpolicy-import-dependency
      ref: project
assertAll:
    - celExpr: "rbacpolicy1.status.id != rbacpolicy2.status.id"
    - celExpr: "rbacpolicy1.status.resource.targetProjectID == project.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RBACPolicy
metadata:
  name: rbacpolicy-import-dependency
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
