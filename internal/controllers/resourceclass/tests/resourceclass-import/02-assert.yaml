---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: ResourceClass
      name: resourceclass-import-external
      ref: resourceclass1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: ResourceClass
      name: resourceclass-import-external-not-this-one
      ref: resourceclass2
assertAll:
    - celExpr: "resourceclass1.status.id != resourceclass2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: ResourceClass
metadata:
  name: resourceclass-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  resource:
    name: resourceclass-import-external
    description: ResourceClass resourceclass-import-external from "resourceclass-import" test
    # TODO(scaffolding): Add all fields the resource supports
