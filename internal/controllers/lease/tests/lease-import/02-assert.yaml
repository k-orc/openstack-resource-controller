---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Lease
      name: lease-import
      ref: imported
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Lease
      name: lease-import-external
      ref: external
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Lease
      name: lease-import-external-not-this-one
      ref: trap
assertAll:
    - celExpr: "imported.status.id == external.status.id"
    - celExpr: "imported.status.id != trap.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-import
status:
  resource:
    name: lease-import-external
    status: PENDING
    startDate: "2097-01-01T10:00:00Z"
    endDate: "2097-01-01T11:00:00Z"
    reservations:
      - resourceType: virtual:instance
        amount: 1
