---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Lease
      name: lease-import-external
      ref: lease1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Lease
      name: lease-import-external-not-this-one
      ref: lease2
assertAll:
    - celExpr: "lease1.status.id != lease2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  resource:
    name: lease-import-external
    description: Lease lease-import-external from "lease-import" test
    # TODO(scaffolding): Add all fields the resource supports
