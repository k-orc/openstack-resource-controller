---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: kubectl create secret generic lease-dependency --from-file=clouds.yaml=${E2E_KUTTL_OSCLOUDS} ${E2E_KUTTL_CACERT_OPT}
    namespaced: true
  # Import the flavor DevStack provides, as the server tests do. It is
  # unmanaged, so deleting the ORC object later leaves the flavor in place.
  - script: |
      cat <<EOT | kubectl apply -n $NAMESPACE -f -
      apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Flavor
      metadata:
        name: lease-dependency
      spec:
        cloudCredentialsRef:
          cloudName: openstack-admin
          secretName: openstack-clouds
        managementPolicy: unmanaged
        import:
          filter:
            name: ${E2E_KUTTL_FLAVOR}
      EOT
