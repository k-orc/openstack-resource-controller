---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-dependency-no-secret
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: lease-dependency
  managementPolicy: managed
  resource:
    # Each lease test uses its own window so that they do not compete for the
    # capacity of the single DevStack host.
    startDate: "2093-01-01T10:00:00Z"
    endDate: "2093-01-01T11:00:00Z"
    reservations:
      - instance:
          amount: 1
          vcpus: 1
          memoryMB: 128
          diskGB: 1
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-dependency-no-flavor
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    startDate: "2098-01-01T10:00:00Z"
    endDate: "2098-01-01T11:00:00Z"
    reservations:
      - flavorInstance:
          amount: 1
          flavorRef: lease-dependency
