---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # We expect the deletion to hang due to the finalizer, so use --wait=false
  - command: kubectl delete flavor.openstack.k-orc.cloud lease-dependency --wait=false
    namespaced: true
  - command: kubectl delete secret lease-dependency --wait=false
    namespaced: true
