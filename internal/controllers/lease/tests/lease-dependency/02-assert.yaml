---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: v1
      kind: Secret
      name: lease-dependency
      ref: secret
assertAll:
    - celExpr: "secret.metadata.deletionTimestamp != 0"
    - celExpr: "'openstack.k-orc.cloud/lease' in secret.metadata.finalizers"
commands:
# The flavor has no deletion guard
- script: "! kubectl get flavor.openstack.k-orc.cloud lease-dependency --namespace $NAMESPACE"
  skipLogOutput: true
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-dependency-no-flavor
status:
  resource:
    status: PENDING
