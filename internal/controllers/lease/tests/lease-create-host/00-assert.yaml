---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-create-host
status:
  resource:
    name: lease-create-host
    status: PENDING
    degraded: false
    startDate: "2094-01-01T10:00:00Z"
    endDate: "2094-01-01T11:00:00Z"
    reservations:
      - resourceType: physical:host
        min: 1
        max: 1
        hypervisorProperties: '[">=", "$vcpus", "1"]'
        resourceProperties: '["==", "$orc", "e2e"]'
  conditions:
  - type: Available
    message: Waiting for OpenStack resource to be ready
    status: "False"
    reason: Progressing
  - type: Progressing
    message: Waiting for OpenStack resource to be ready
    status: "True"
    reason: Progressing
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Lease
      name: lease-create-host
      ref: lease
assertAll:
    - celExpr: "lease.status.id != ''"
    - celExpr: "lease.status.resource.projectID != ''"
    - celExpr: "lease.status.resource.userID != ''"
    - celExpr: "has(lease.status.resource.createdAt)"
    - celExpr: "lease.status.resource.reservations[0].id != ''"
    # Host reservations have no flavor, server group or instance fields
    - celExpr: "!has(lease.status.resource.reservations[0].flavorID)"
    - celExpr: "!has(lease.status.resource.reservations[0].serverGroupID)"
    - celExpr: "!has(lease.status.resource.reservations[0].amount)"
