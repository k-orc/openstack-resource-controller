      kind: Lease
      name: lease-create-full
      ref: lease
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Flavor
      name: lease-create-full
      ref: flavor
assertAll:
    - celExpr: "lease.status.id != ''"
    - celExpr: "lease.status.resource.flavorID == flavor.status.id"
