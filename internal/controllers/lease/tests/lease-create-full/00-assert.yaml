---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-create-full
status:
  resource:
    name: lease-create-full-override
    description: Lease from "create full" test
    # TODO(scaffolding): Add all fields the resource supports
  conditions:
  - type: Available
    status: "True"
