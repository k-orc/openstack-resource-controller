---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-create-full
status:
  resource:
    name: lease-create-full-override
    status: PENDING
    degraded: false
    startDate: "2095-01-01T10:00:00Z"
    endDate: "2095-01-01T11:00:00Z"
    reservations:
      - resourceType: virtual:instance
        amount: 1
        vcpus: 1
        memoryMB: 128
        diskGB: 1
        affinity: false
        resourceProperties: '["==", "$orc", "e2e"]'
  # The lease has not started, so it is not available yet
  conditions:
  - type: Available
    message: Waiting for OpenStack resource to be ready
    status: "False"
    reason: Progressing
  - type: Progressing
    message: Waiting for OpenStack resource to be ready
    status: "True"
    reason: Progressing
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Lease
      name: lease-create-full
      ref: lease
assertAll:
    - celExpr: "lease.status.id != ''"
    - celExpr: "lease.status.resource.projectID != ''"
    - celExpr: "lease.status.resource.userID != ''"
    - celExpr: "has(lease.status.resource.createdAt)"
    - celExpr: "lease.status.resource.reservations[0].flavorID == lease.status.resource.reservations[0].id"
    # affinity: false makes Blazar create an anti-affinity server group
    - celExpr: "lease.status.resource.reservations[0].serverGroupID != ''"
    - celExpr: "!has(lease.status.resource.reservations[0].min)"
