---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Limit
      name: limit-import-external
      ref: limit1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Limit
      name: limit-import-external-not-this-one
      ref: limit2
assertAll:
    - celExpr: "limit1.status.id != limit2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Limit
metadata:
  name: limit-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  resource:
    name: limit-import-external
    description: Limit limit-import-external from "limit-import" test
    # TODO(scaffolding): Add all fields the resource supports
