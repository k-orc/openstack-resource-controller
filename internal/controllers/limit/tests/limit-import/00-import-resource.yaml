---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Service
metadata:
  name: service-limit-import
  labels:
    test-case: limit-import
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    type: "service-type-limit-import"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Project
metadata:
  name: project-limit-import
  labels:
    test-case: limit-import
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    domainRef: domain-limit-import
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Domain
metadata:
  name: domain-limit-import
  labels:
    test-case: limit-import
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource: {}
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Limit
metadata:
  name: limit-import
  labels:
    test-case: limit-import
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: unmanaged
  import:
    filter:
      serviceRef: service-limit-import
      projectRef: project-limit-import
      resourceName: limit-import
