apiVersion: apps/v1
kind: Deployment
metadata:
  name: setup-teardown
status:
  readyReplicas: 1
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Service
metadata:
  name: service-limit-import
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Project
metadata:
  name: project-limit-import
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Domain
metadata:
  name: domain-limit-import
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Limit
metadata:
  name: limit-import
status:
  conditions:
    - type: Available
      message: Waiting for OpenStack resource to be created externally
      status: "False"
      reason: Progressing
    - type: Progressing
      message: Waiting for OpenStack resource to be created externally
      status: "True"
      reason: Progressing
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - selector: app=setup-teardown
commands:
  - script: |-
      cd $(dirname ${E2E_KUTTL_OSCLOUDS})
      export OS_CLOUD=openstack-admin
      openstack registered limit list --resource-name limit-import &&
      openstack registered limit list --resource-name limit-import-nonexistent-resource
