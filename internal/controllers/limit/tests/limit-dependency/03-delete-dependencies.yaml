---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # We expect the deletion to hang due to the finalizer, so use --wait=false
  - command: kubectl delete service.openstack.k-orc.cloud,project,domain -l test-case=limit-dependency --wait=false
    namespaced: true
  - command: kubectl delete secret limit-dependency --wait=false
    namespaced: true
