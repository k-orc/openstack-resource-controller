apiVersion: apps/v1
kind: Deployment
metadata:
  name: setup-teardown
  labels:
    app: setup-teardown
spec:
  replicas: 1
  selector:
    matchLabels:
      app: setup-teardown
  template:
    metadata:
      labels:
        app: setup-teardown
    spec:
      containers:
        - name: setup-teardown
          image: golang:alpine
          command:
            - sh
            - -c
            - |
              mkdir /test-helper &&
              cp /app/* /test-helper &&
              cd /test-helper;
              go mod init test-helper &&
              go mod tidy &&
              go build -o ./test-helper . &&
              exec ./test-helper
          volumeMounts:
            - name: openstack-clouds
              mountPath: /etc/openstack
              readOnly: true
            - name: common
              mountPath: /app
              readOnly: true
            - name: log-volume
              mountPath: /log
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: READINESS_FILE
              value: /helper/ready
            - name: OS_CLOUD
              value: openstack-admin
            - name: TEST_CASE
              value: limit-dependency
            - name: REGISTER_LIMITS
              value: service-limit-dependency/limit-dependency-1/100,service-limit-dependency/limit-dependency-2/100,service-limit-dependency/limit-dependency-3/100
            - name: DOMAINS
              value: domain-limit-dependency
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /helper/ready
            initialDelaySeconds: 3
            periodSeconds: 1
      terminationGracePeriodSeconds: 60
      volumes:
        - name: openstack-clouds
          secret:
            secretName: openstack-clouds
        - name: common
          configMap:
            name: common
        - name: log-volume
          hostPath:
            path: /log
            type: DirectoryOrCreate
