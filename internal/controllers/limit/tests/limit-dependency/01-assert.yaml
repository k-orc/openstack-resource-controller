---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - selector: app=setup-teardown
commands:
  - script: |-
      cd $(dirname ${E2E_KUTTL_OSCLOUDS})
      export OS_CLOUD=openstack-admin
      openstack registered limit list --resource-name limit-dependency-1 &&
      openstack registered limit list --resource-name limit-dependency-2 &&
      openstack registered limit list --resource-name limit-dependency-3
