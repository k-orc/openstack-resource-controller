---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Service
metadata:
  name: limit-import-dependency
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: unmanaged
  import:
    filter:
      name: limit-import-dependency-external
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Project
metadata:
  name: limit-import-dependency
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: unmanaged
  import:
    filter:
      name: limit-import-dependency-external
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Domain
metadata:
  name: limit-import-dependency
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: unmanaged
  import:
    filter:
      name: limit-import-dependency-external
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Limit
metadata:
  name: limit-import-dependency
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: unmanaged
  import:
    filter:
      serviceRef: limit-import-dependency
      projectRef: limit-import-dependency
      domainRef: limit-import-dependency
