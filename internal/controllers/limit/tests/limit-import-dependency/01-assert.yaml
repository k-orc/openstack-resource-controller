apiVersion: apps/v1
kind: Deployment
metadata:
  name: setup-teardown
status:
  readyReplicas: 1
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Limit
    name: limit-import-dependency
    ref: limit1
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Limit
    name: limit-import-dependency-external
    ref: limit2
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Project
    name: project-limit-import-dependency
    ref: project
assertAll:
  - celExpr: "limit1.status.id == limit2.status.id"
  - celExpr: "limit1.status.resource.projectID == project.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Limit
metadata:
  name: limit-import-dependency
status:
  resource:
    resourceName: limit-import-dependency
    resourceLimit: 50
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
