apiVersion: apps/v1
kind: Deployment
metadata:
  name: setup-teardown
status:
  readyReplicas: 1
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Service
metadata:
  name: service-limit-create-minimal
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Project
metadata:
  name: project-limit-create-minimal
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Domain
metadata:
  name: domain-limit-create-minimal
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Limit
metadata:
  name: limit-create-minimal-1
status:
  resource:
    resourceName: limit-create-minimal-1
    resourceLimit: 50
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Limit
metadata:
  name: limit-create-minimal-2
status:
  resource:
    resourceName: limit-create-minimal-2
    resourceLimit: 10
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - selector: app=setup-teardown
commands:
  - script: |-
      cd $(dirname ${E2E_KUTTL_OSCLOUDS})
      export OS_CLOUD=openstack-admin
      openstack registered limit list --resource-name limit-create-minimal-1 &&
      openstack registered limit list --resource-name limit-create-minimal-2
resourceRefs:
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Limit
    name: limit-create-minimal-1
    ref: limit1
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Limit
    name: limit-create-minimal-2
    ref: limit2
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Service
    name: service-limit-create-minimal
    ref: service
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Project
    name: project-limit-create-minimal
    ref: project
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Domain
    name: domain-limit-create-minimal
    ref: domain
assertAll:
  - celExpr: "limit1.status.id != ''"
  - celExpr: "!has(limit1.status.resource.description) || limit1.status.resource.description == ''"
  - celExpr: "limit2.status.id != ''"
  - celExpr: "!has(limit2.status.resource.description) || limit2.status.resource.description == ''"
  - celExpr: "limit1.status.resource.serviceID == service.status.id"
  - celExpr: "limit2.status.resource.serviceID == service.status.id"
  - celExpr: "limit1.status.resource.projectID == project.status.id"
  - celExpr: "limit2.status.resource.domainID == domain.status.id"
