# Skip limit import tests due to a Keystone API issue (list limit) in older versions.
# This test also needs admin credentials: skipped by test runs labelled admin=false.
apiVersion: kuttl.dev/v1beta1
kind: TestCase
testRunSelector:
  matchExpressions:
  - key: "max-2025.2"
    operator: NotIn
    values:
    - "true"
  - key: admin
    operator: NotIn
    values: ["false"]
