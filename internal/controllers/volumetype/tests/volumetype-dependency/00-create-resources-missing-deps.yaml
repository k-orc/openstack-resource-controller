---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: VolumeType
metadata:
  name: volumetype-dependency-no-project
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    isPublic: false
    projectRefs:
    - volumetype-dependency
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: VolumeType
metadata:
  name: volumetype-dependency-no-secret
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: volumetype-dependency
  managementPolicy: managed
  resource: {}
