---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: VolumeType
metadata:
  name: volumetype-import-with-project-external
status:
  conditions:
    - type: Available
      status: "True"
      reason: Success
    - type: Progressing
      status: "False"
      reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: VolumeType
    name: volumetype-import-with-project-external
    ref: volumetype
  - apiVersion: openstack.k-orc.cloud/v1alpha1
    kind: Project
    name: volumetype-import-with-project-external
    ref: project
assertAll:
  - celExpr: "volumetype.status.id != ''"
  - celExpr: "project.status.id in volumetype.status.resource.projectIDs"
