---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: RecordSet
      name: recordset-import-external
      ref: recordset1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: RecordSet
      name: recordset-import-external-not-this-one
      ref: recordset2
assertAll:
    - celExpr: "recordset1.status.id != recordset2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RecordSet
metadata:
  name: recordset-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  resource:
    name: external.recordset-import.example.com.
    description: RecordSet recordset-import-external from "recordset-import" test
