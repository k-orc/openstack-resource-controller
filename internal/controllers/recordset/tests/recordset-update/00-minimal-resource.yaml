---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZone
metadata:
  name: recordset-update
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: recordset-update.example.com.
    email: admin@example.com
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RecordSet
metadata:
  name: recordset-update
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: www.recordset-update.example.com.
    zoneRef: recordset-update
    type: A
    records:
      - 192.0.2.1
