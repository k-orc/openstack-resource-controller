---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZone
metadata:
  name: recordset-create-full
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: recordset-create-full.example.com.
    email: admin@example.com
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RecordSet
metadata:
  name: recordset-create-full
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: www.recordset-create-full.example.com.
    description: RecordSet from "create full" test
    zoneRef: recordset-create-full
    type: A
    records:
      - 192.0.2.1
      - 192.0.2.2
    ttl: 300
