---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RecordSet
metadata:
  name: recordset-create-full
status:
  resource:
    name: www.recordset-create-full.example.com.
    description: RecordSet from "create full" test
    type: A
    records:
      - 192.0.2.1
      - 192.0.2.2
    ttl: 300
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: RecordSet
      name: recordset-create-full
      ref: recordset
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSZone
      name: recordset-create-full
      ref: dnszone
assertAll:
    - celExpr: "recordset.status.id != ''"
    - celExpr: "recordset.status.resource.zoneID == dnszone.status.id"
    - celExpr: "recordset.status.resource.projectID != ''"
