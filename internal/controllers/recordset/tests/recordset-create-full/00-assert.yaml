---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RecordSet
metadata:
  name: recordset-create-full
status:
  resource:
    name: recordset-create-full-override
    description: RecordSet from "create full" test
    # TODO(scaffolding): Add all fields the resource supports
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: RecordSet
      name: recordset-create-full
      ref: recordset
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSZone
      name: recordset-create-full
      ref: dNSZone
assertAll:
    - celExpr: "recordset.status.id != ''"
    - celExpr: "recordset.status.resource.dNSZoneID == dNSZone.status.id"
    # TODO(scaffolding): Add more checks
