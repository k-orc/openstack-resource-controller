---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # We expect the deletion to hang due to the finalizer, so use --wait=false
  - command: kubectl delete dnszone.openstack.k-orc.cloud recordset-dependency --wait=false
    namespaced: true
  - command: kubectl delete secret recordset-dependency --wait=false
    namespaced: true
