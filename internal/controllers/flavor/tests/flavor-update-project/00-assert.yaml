---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Flavor
      name: flavor-update-project
      ref: flavor
assertAll:
    - celExpr: "!has(flavor.status.resource.projectIDs)"
    - celExpr: "!flavor.status.resource.isPublic"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Flavor
metadata:
  name: flavor-update-project
status:
  resource:
    name: flavor-update-project
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
