apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Project
metadata:
  name: flavor-import-with-project-external
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource: {}
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Flavor
metadata:
  name: flavor-import-with-project-external
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    isPublic: False
    ram: 1
    vcpus: 2
    disk: 0
    projectRefs:
      - flavor-import-with-project-external
