---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSZone
metadata:
  name: dnszone-create-full-secondary
status:
  resource:
    name: dnszone-create-full-secondary.example.com.
    description: DNSZone from "create full" test
    type: SECONDARY
    masters:
      - 192.0.2.1
      - 192.0.2.2
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSZone
      name: dnszone-create-full-secondary
      ref: dnszone
assertAll:
    - celExpr: "dnszone.status.id != ''"
    - celExpr: "dnszone.status.resource.projectID != ''"
