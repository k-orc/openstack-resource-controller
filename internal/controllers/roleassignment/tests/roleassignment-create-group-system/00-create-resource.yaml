---
# Create a test role
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Role
metadata:
  name: roleassignment-gs-test-role
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: roleassignment-gs-test-role
---
# Create a test group
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Group
metadata:
  name: roleassignment-gs-test-group
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: roleassignment-gs-test-group
---
# Create role assignment (group on system)
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RoleAssignment
metadata:
  name: roleassignment-create-group-system
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    roleRef: roleassignment-gs-test-role
    groupRef: roleassignment-gs-test-group
    system: all
