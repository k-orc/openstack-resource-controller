---
# Create a test role
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Role
metadata:
  name: roleassignment-us-test-role
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: roleassignment-us-test-role
---
# Create a test user
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: User
metadata:
  name: roleassignment-us-test-user
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    name: roleassignment-us-test-user
---
# Create the role assignment
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: RoleAssignment
metadata:
  name: roleassignment-create-user-system
spec:
  cloudCredentialsRef:
    cloudName: openstack-admin
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    roleRef: roleassignment-us-test-role
    userRef: roleassignment-us-test-user
    system: all
