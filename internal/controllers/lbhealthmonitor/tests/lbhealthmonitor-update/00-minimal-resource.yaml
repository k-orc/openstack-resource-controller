---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: LBHealthMonitor
metadata:
  name: lbhealthmonitor-update
spec:
  cloudCredentialsRef:
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    poolRef: lbhealthmonitor-update
    type: HTTP
    delay: 10
    timeout: 5
    maxRetries: 3
