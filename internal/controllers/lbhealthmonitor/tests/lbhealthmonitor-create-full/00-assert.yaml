---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: LBHealthMonitor
metadata:
  name: lbhealthmonitor-create-full
status:
  resource:
    name: lbhealthmonitor-create-full-override
    type: HTTP
    delay: 10
    timeout: 5
    maxRetries: 3
    maxRetriesDown: 4
    httpMethod: HEAD
    httpVersion: "1.1"
    expectedCodes: "200-204"
    urlPath: /healthz
    domainName: example.com
    adminStateUp: false
    provisioningStatus: ACTIVE
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: LBHealthMonitor
      name: lbhealthmonitor-create-full
      ref: monitor
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: LBPool
      name: lbhealthmonitor-create-full
      ref: pool
assertAll:
    - celExpr: "monitor.status.resource.poolID == pool.status.id"
    - celExpr: "size(monitor.status.resource.tags) == 2 && 'tag1' in monitor.status.resource.tags && 'tag2' in monitor.status.resource.tags"
