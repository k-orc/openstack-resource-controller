---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: LBHealthMonitor
      name: lbhealthmonitor-import-external
      ref: lbhealthmonitor1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: LBHealthMonitor
      name: lbhealthmonitor-import-external-not-this-one
      ref: lbhealthmonitor2
assertAll:
    - celExpr: "lbhealthmonitor1.status.id != lbhealthmonitor2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: LBHealthMonitor
metadata:
  name: lbhealthmonitor-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  resource:
    name: lbhealthmonitor-import-external
    description: LBHealthMonitor lbhealthmonitor-import-external from "lbhealthmonitor-import" test
    # TODO(scaffolding): Add all fields the resource supports
