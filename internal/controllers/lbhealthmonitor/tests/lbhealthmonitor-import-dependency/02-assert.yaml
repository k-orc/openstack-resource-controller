---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: LBHealthMonitor
      name: lbhealthmonitor-import-dependency
      ref: lbhealthmonitor1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: LBHealthMonitor
      name: lbhealthmonitor-import-dependency-not-this-one
      ref: lbhealthmonitor2
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: LBPool
      name: lbhealthmonitor-import-dependency
      ref: lBPool
assertAll:
    - celExpr: "lbhealthmonitor1.status.id != lbhealthmonitor2.status.id"
    - celExpr: "lbhealthmonitor1.status.resource.lBPoolID == lBPool.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: LBHealthMonitor
metadata:
  name: lbhealthmonitor-import-dependency
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
