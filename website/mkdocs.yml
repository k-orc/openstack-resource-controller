# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: openstack-resource-controller
site_url: https://k-orc.cloud/
nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Tutorial: getting-started.md
  - Concepts:
    - Core Concepts: concepts/core-concepts.md
    - Design Principles: concepts/design-principles.md
    - Drift Detection & External Deletion: concepts/drift-detection.md
  - How-to Guides:
    - Set Up Cloud Credentials: howto/cloud-credentials.md
    - Enable Drift Detection: howto/drift-detection.md
    - Troubleshooting: troubleshooting.md
  - Reference:
    - Controller Configuration: reference/configuration.md
    - Status Conditions: reference/conditions.md
    - CRD Reference: crd-reference.md
  - Contributing:
    - Contributing: development/contributing.md
    - Development Quickstart: development/quickstart.md
    - Running Examples: development/running-examples.md
    - Developing Controllers:
      - Overview: development/overview.md
      - Scaffolding a New Controller: development/scaffolding.md
      - API Design: development/api-design.md
      - Controller Initialisation: development/controller-init.md
      - Resource Interfaces: development/interfaces.md
      - Controller Implementation: development/controller-implementation.md
      - Writing Tests: development/writing-tests.md
    - Reference:
      - Architecture: development/architecture.md
      - Coding Standards: development/coding-standards.md
      - Interfaces: development/godoc/generic-interfaces.md
      - ReconcileStatus: development/godoc/reconcile-status.md
  - Changelog: changelog.md
repo_url: https://github.com/k-orc/openstack-resource-controller
extra:
  analytics:
    provider: p
    data_domain: k-orc.cloud
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k-orc/openstack-resource-controller
    - icon: fontawesome/brands/slack
      link: slack://channel?team=T09NY5SBT&id=C05G4NJ6P6X
site_dir: rendered
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.expand
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to light mode
plugins:
  - search:
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true
  - redirects:
      redirect_maps:
        'getting_started.md': 'getting-started.md'
        'development/index.md': 'development/contributing.md'
        'development/controller-design.md': 'development/controller-implementation.md'
        'development/design-decisions.md': 'concepts/design-principles.md'
        'development/coding-convention.md': 'development/coding-standards.md'
        'development/api-contracts.md': 'development/api-design.md'
        'user-guide/index.md': 'concepts/core-concepts.md'
        'user-guide/drift-detection.md': 'concepts/drift-detection.md'
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
