---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: ImageMember
metadata:
  name: imagemember-sample
spec:
  cloudCredentialsRef:
    # The credentials of the project the image is shared with, not of the
    # image owner: only the member can set its status.
    cloudName: openstack
    secretName: openstack-clouds
  managementPolicy: managed
  resource:
    # The Image must list this project in spec.resource.members
    imageRef: image-sample
    status: accepted
